*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.45;text-wrap:pretty;
  -webkit-font-smoothing:antialiased;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-0.02em;line-height:1.05}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in oklab,var(--accent) 40%,transparent)}
a:hover{color:var(--ink);border-bottom-color:var(--ink)}
.tnum{font-variant-numeric:tabular-nums}
.label{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);
}

/* ── masthead ─────────────────────────────── */
header.mast{border-bottom:2px solid var(--ink);padding:20px 0 12px;margin-bottom:8px}
.mast .wrap{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
.mast h1{font-size:clamp(21px,6.4vw,30px);text-transform:uppercase;letter-spacing:-0.015em}
.mast .dot{display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--accent);vertical-align:.08em;margin-left:.18em}

/* ── sticky store bar ─────────────────────── */
#bar{
  position:sticky;top:0;z-index:20;
  margin:0 -18px;padding:8px 18px 9px;
  background:color-mix(in oklab,var(--bg) 90%,transparent);
  backdrop-filter:saturate(1.35) blur(10px);
  border-bottom:1px solid var(--rule);
}
.barline{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
.barline .go2{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.barline .go2 b{color:var(--accent);font-weight:700}
.picked{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--good)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  margin:0 -18px;padding:1px 18px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;font:inherit;font-size:13px;font-weight:600;letter-spacing:-0.005em;
  min-height:34px;padding:0 12px;border-radius:999px;cursor:pointer;
  background:transparent;color:var(--ink-2);border:1px solid var(--rule);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.chip u{text-decoration:none;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] u{color:color-mix(in oklab,var(--bg) 72%,var(--ink))}
@media print{#bar{display:none}}

/* ── hero ─────────────────────────────────── */
.hero{padding:14px 0 26px}
.hero .kicker{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hero .go{
  font-size:clamp(38px,13.5vw,74px);font-weight:800;letter-spacing:-0.045em;
  line-height:0.94;margin:0 0 2px;
}
.hero .go em{font-style:normal;color:var(--accent);display:block}
.hero .sub{color:var(--ink-2);font-size:15px;margin:10px 0 0;max-width:44ch}
.hero .sub b{color:var(--ink);font-weight:700}

.rank{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px}
.rank ol{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.rank li{display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:baseline}
.rank .nm{font-weight:700;font-size:15px;letter-spacing:-0.01em}
.rank .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.rank .bar{grid-column:1/-1;height:9px;border-radius:2px;background:var(--rule-2);overflow:hidden}
.rank .bar i{display:block;height:100%;background:color-mix(in oklab,var(--accent) 34%,var(--rule));border-radius:2px}
.rank li:first-child .nm{font-size:17px}
.rank li:first-child .bar i{background:var(--accent)}

/* ── sections ─────────────────────────────── */
section{padding:26px 0}
.sechead{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;
  border-bottom:2px solid var(--ink);padding-bottom:8px}
.sechead h2{font-size:clamp(19px,5vw,25px);text-transform:uppercase}
.sechead .label{margin-left:auto;white-space:nowrap}

/* ── cards ────────────────────────────────── */
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{
  position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:4px;
  padding:14px 14px 12px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:9px;
}
.card .top{display:flex;align-items:flex-start;gap:10px}
.card .item{font-size:17px;font-weight:800;letter-spacing:-0.015em;text-transform:capitalize;flex:1}
.card .health{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-top:3px;white-space:nowrap}
.card .health i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.h-real i{background:var(--good)} .h-ok i{background:var(--warn)}
.h-ultra i{background:var(--bad)} .h-na i{background:var(--ink-3)}
.priceline{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.price{font-size:38px;font-weight:800;letter-spacing:-0.045em;line-height:1}
.unit{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.card .prod{font-family:var(--mono);font-size:11px;line-height:1.4;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.02em}
.card .store{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.card .store .spark{margin-left:auto}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11.5px;line-height:1.25;padding:4px 8px;border-radius:999px;
  background:var(--rule-2);color:var(--ink-2)}
.badge.win{background:var(--accent-tint);color:color-mix(in oklab,var(--accent) 72%,var(--ink))}
.badge.low{background:var(--good-tint);color:color-mix(in oklab,var(--good) 65%,var(--ink))}
.badge.multi{background:var(--warn-tint);color:color-mix(in oklab,var(--warn) 55%,var(--ink))}
.badge.delta{background:var(--accent);color:oklch(0.99 0.01 85);font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.card[aria-checked="true"]{opacity:.45}
.card[aria-checked="true"] .price,.card[aria-checked="true"] .item{text-decoration:line-through}
.card[aria-checked="true"] .health{visibility:hidden}
.card[aria-checked="true"]::after{
  content:"\2713 got it";position:absolute;top:13px;right:14px;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--good);
}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details.alts{margin-top:auto;border-top:1px solid var(--rule-2);padding-top:8px}
details.alts summary{
  list-style:none;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px;
  min-height:30px;
}
details.alts summary::-webkit-details-marker{display:none}
details.alts summary::after{content:"+";font-size:14px;margin-left:auto;color:var(--ink-3)}
details.alts[open] summary::after{content:"\2212"}
details.alts summary:hover{color:var(--ink)}
.alt{display:flex;gap:10px;align-items:baseline;padding:5px 0;font-size:13.5px;border-top:1px dashed var(--rule-2)}
.alt .as{flex:1;color:var(--ink-2)}
.alt .ap{font-weight:700}
.alt .au{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.spark{display:block}

/* my list */
.mylist .card{border-color:color-mix(in oklab,var(--accent) 45%,var(--rule));
  box-shadow:0 0 0 1px color-mix(in oklab,var(--accent) 22%,transparent),var(--shadow)}
.pin{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);display:flex;align-items:center;gap:6px}
.pin::before{content:"";width:14px;height:2px;background:var(--accent)}

/* traps */
.traps{border-top:1px solid var(--rule)}
.trapgrid{display:grid;gap:10px}
@media (min-width:760px){.trapgrid{grid-template-columns:repeat(2,1fr)}}
.trap{
  background:var(--bad-tint);border:1px solid color-mix(in oklab,var(--bad) 30%,transparent);
  border-radius:4px;padding:12px 13px;display:grid;gap:5px;
}
.trap .th{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.trap .ti{font-weight:800;font-size:15.5px;text-transform:capitalize;letter-spacing:-0.01em}
.trap .tp{font-weight:800;font-size:15.5px;color:var(--bad);margin-left:auto}
.trap .tprod{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-transform:uppercase}
.trap .tr{font-size:13.5px;color:var(--ink);border-top:1px dashed color-mix(in oklab,var(--bad) 32%,transparent);padding-top:6px}
.trap .tr b{color:var(--bad)}

/* footer */
footer{border-top:2px solid var(--ink);margin-top:14px;padding:20px 0 34px;color:var(--ink-3)}
footer .meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.06em;text-transform:uppercase}
footer .meta span b{color:var(--ink-2);font-weight:700}
footer .repo{margin-top:12px;font-size:13.5px}
.empty{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding:8px 0}
</style>
</head>
<body>

<header class="mast">
  <div class="wrap">
    <h1>Halifax Grocery Deals<span class="dot"></span></h1>
    <span class="label" id="mastWeek"></span>
  </div>
</header>

<main class="wrap">

  <div class="hero" id="hero">
    <div class="kicker"><span class="label">This week</span></div>
    <h2 class="go">Go to <em id="verdictStore">—</em></h2>
    <p class="sub" id="heroSub"></p>
    <div class="rank">
      <div class="label" style="margin-bottom:12px">Store ranking &mdash; deal density &times; savings</div>
      <ol id="ranking"></ol>
    </div>
  </div>

  <div class="bar" id="bar">
    <div class="barline">
      <span class="go2">Go to <b id="barStore">—</b></span>
      <span class="picked" id="picked" hidden></span>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by store"></div>
  </div>

  <section class="mylist" id="mylistSection" hidden>
    <div class="sechead">
      <h2>My list</h2>
      <span class="label" id="mylistCount"></span>
    </div>
    <div class="grid" id="mylist"></div>
  </section>

  <section>
    <div class="sechead">
      <h2>Staple deals</h2>
      <span class="label" id="dealsCount"></span>
    </div>
    <div class="grid" id="deals"></div>
  </section>

  <section class="traps" id="trapsSection" hidden>
    <div class="sechead">
      <h2>Sale traps</h2>
      <span class="label">Not actually cheap</span>
    </div>
    <div class="trapgrid" id="traps"></div>
  </section>

</main>

<footer>
  <div class="wrap">
    <div class="meta" id="footMeta"></div>
    <div class="repo" id="footRepo"></div>
  </div>
</footer>

<script>
(function () {
  var D = window.DATA || {};
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  function money(v) {
    return typeof v === "number" ? "$" + v.toFixed(2) : String(v == null ? "" : v);
  }
  function weekLabel(iso) {
    if (!iso) return "";
    var p = String(iso).split("-");
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  }
  var HEALTH = { real: "Real food", ok: "OK", ultra: "Ultra-processed", na: "—" };

  /* ---- picked-up state (per week) ---- */
  var KEY = "hgd:got:" + (D.week || "unknown");
  var got = {};
  try { got = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { got = {}; }
  function saveGot() { try { localStorage.setItem(KEY, JSON.stringify(got)); } catch (e) {} }

  /* ---- sparkline ---- */
  function sparkline(series) {
    if (!series || series.length < 3) return null;
    var w = 62, h = 20, pad = 2;
    var min = Math.min.apply(null, series), max = Math.max.apply(null, series);
    var span = (max - min) || 1;
    var pts = series.map(function (v, i) {
      var x = pad + i * ((w - pad * 2) / (series.length - 1));
      var y = pad + (1 - (v - min) / span) * (h - pad * 2);
      return [x, y];
    });
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "spark");
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("width", w); svg.setAttribute("height", h);
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", series.length + "-week price trend, " + money(series[0]) + " to " + money(series[series.length - 1]));
    var line = document.createElementNS(svg.namespaceURI, "polyline");
    line.setAttribute("fill", "none");
    line.setAttribute("stroke", "currentColor");
    line.setAttribute("stroke-width", "1.4");
    line.setAttribute("stroke-linejoin", "round");
    line.setAttribute("stroke-linecap", "round");
    line.setAttribute("opacity", ".5");
    line.setAttribute("points", pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "));
    svg.appendChild(line);
    var last = pts[pts.length - 1];
    var dot = document.createElementNS(svg.namespaceURI, "circle");
    dot.setAttribute("cx", last[0].toFixed(1)); dot.setAttribute("cy", last[1].toFixed(1));
    dot.setAttribute("r", "2.1"); dot.setAttribute("fill", "currentColor");
    svg.appendChild(dot);
    return svg;
  }

  function badgeClass(text) {
    var t = String(text).toLowerCase();
    if (t.indexOf("beats walmart") === 0 || t.indexOf("beats ") === 0) return "badge win";
    if (t.indexOf("lowest") > -1 || t.indexOf("low") > -1 || t.indexOf("cheapest") > -1) return "badge low";
    if (t.indexOf("buy ") === 0 || t.indexOf("or more") > -1) return "badge multi";
    return "badge";
  }

  /* ---- deal card ---- */
  function card(d) {
    var c = el("article", "card");
    c.setAttribute("role", "checkbox");
    c.tabIndex = 0;
    c.setAttribute("aria-checked", got[d.item] ? "true" : "false");
    c.setAttribute("aria-label", d.item + ", " + money(d.price) + " at " + (d.store || "") + ". Tap when picked up.");

    function toggle() {
      var on = c.getAttribute("aria-checked") !== "true";
      c.setAttribute("aria-checked", on ? "true" : "false");
      if (on) { got[d.item] = 1; } else { delete got[d.item]; }
      saveGot(); updatePicked();
    }
    c.addEventListener("click", function (e) {
      if (e.target.closest("details") || e.target.closest("a")) return;
      toggle();
    });
    c.addEventListener("keydown", function (e) {
      if (e.key === " " || e.key === "Enter") {
        if (e.target.closest("details")) return;
        e.preventDefault(); toggle();
      }
    });

    var top = el("div", "top");
    top.appendChild(el("h3", "item", d.item || ""));
    if (d.health) {
      var hv = el("span", "health h-" + d.health);
      hv.appendChild(el("i"));
      hv.appendChild(el("span", null, HEALTH[d.health] || d.health));
      top.appendChild(hv);
    }
    c.appendChild(top);

    var pl = el("div", "priceline");
    pl.appendChild(el("div", "price tnum", money(d.price)));
    if (d.unitPrice) pl.appendChild(el("div", "unit tnum", d.unitPrice));
    c.appendChild(pl);

    if (d.product) c.appendChild(el("p", "prod", d.product));

    var st = el("div", "store");
    st.appendChild(el("span", null, d.store || ""));
    var sp = sparkline((D.history || {})[d.item]);
    if (sp) { sp.classList.add("spark"); st.appendChild(sp); }
    c.appendChild(st);

    var bl = (d.badges || []).slice();
    if (d.multiItem) bl.unshift("multi-item deal");
    var extraAlts = [], chips = [];
    bl.forEach(function (b) {
      var m = String(b).match(/beats\s+([A-Za-z'’. ]+?)\s+everyday\s*\(\$([0-9.]+)([^)]*)\)/i);
      if (m && typeof d.price === "number") {
        var ref = parseFloat(m[2]), rival = m[1].trim(), note = m[3].replace(/^[\s,—-]+/, "").trim();
        chips.unshift({ cls: "badge delta", text: "\u2212$" + (ref - d.price).toFixed(2) + " vs " + rival });
        extraAlts.push({ store: rival + " everyday", price: ref, unitPrice: note });
      } else {
        chips.push({ cls: badgeClass(b), text: b });
      }
    });
    if (chips.length) {
      var bw = el("div", "badges");
      chips.forEach(function (b) { bw.appendChild(el("span", b.cls, b.text)); });
      c.appendChild(bw);
    }

    var alts = (d.alts || []).concat(extraAlts);
    if (alts.length) {
      var det = el("details", "alts");
      var sum = el("summary", null, alts.length === 1 ? "1 alternative" : alts.length + " alternatives");
      det.appendChild(sum);
      alts.forEach(function (a) {
        var r = el("div", "alt");
        r.appendChild(el("span", "as", a.store || ""));
        r.appendChild(el("span", "ap tnum", money(a.price)));
        if (a.unitPrice) r.appendChild(el("span", "au tnum", a.unitPrice));
        det.appendChild(r);
      });
      c.appendChild(det);
    }
    return c;
  }

  /* ---- verdict ---- */
  var v = D.verdict || {};
  $("verdictStore").textContent = v.store || "—";
  $("barStore").textContent = v.store || "—";
  $("mastWeek").textContent = "Week of " + weekLabel(D.week);

  var top1 = (v.ranking || [])[0];
  var subBits = [];
  if (top1) subBits.push("<b>" + top1.dealCount + " genuine deal" + (top1.dealCount === 1 ? "" : "s") + "</b> there");
  if (D.flyerCount) subBits.push(D.flyerCount + " flyers compared");
  if (D.pricesChecked) subBits.push(D.pricesChecked.toLocaleString() + " prices sanity-checked against Walmart everyday");
  $("heroSub").innerHTML = subBits.join(" &middot; ") + ".";

  var rk = $("ranking"), maxScore = 0;
  (v.ranking || []).forEach(function (r) { maxScore = Math.max(maxScore, r.score || 0); });
  (v.ranking || []).forEach(function (r) {
    var li = el("li");
    li.appendChild(el("span", "nm", r.store));
    var n = r.dealCount || 0;
    li.appendChild(el("span", "ct tnum", n + (n === 1 ? " deal" : " deals")));
    var bar = el("span", "bar");
    var fill = el("i");
    fill.style.width = Math.max(3, ((r.score || 0) / (maxScore || 100)) * 100) + "%";
    bar.appendChild(fill);
    li.appendChild(bar);
    rk.appendChild(li);
  });

  /* ---- lists ---- */
  var deals = D.deals || [];
  var mine = deals.filter(function (d) { return d.onMyList; });
  var rest = deals.filter(function (d) { return !d.onMyList; });
  var rows = [];

  var mw = $("mylist");
  mine.forEach(function (d) {
    var c = card(d);
    c.insertBefore(el("div", "pin", "On my list"), c.firstChild);
    mw.appendChild(c);
    rows.push({ store: d.store, node: c, list: "mine" });
  });

  var dw = $("deals");
  rest.forEach(function (d) {
    var c = card(d);
    dw.appendChild(c);
    rows.push({ store: d.store, node: c, list: "rest" });
  });
  var emptyMsg = el("p", "empty", "");
  emptyMsg.hidden = true;
  dw.parentNode.appendChild(emptyMsg);

  var traps = D.traps || [], trapRows = [];
  var tw = $("traps");
  traps.forEach(function (t) {
    var n = el("div", "trap");
    var h = el("div", "th");
    h.appendChild(el("span", "ti", t.item || ""));
    h.appendChild(el("span", "tp tnum", money(t.price)));
    n.appendChild(h);
    if (t.product) n.appendChild(el("p", "tprod", (t.store ? t.store + " \u2014 " : "") + t.product));
    var r = el("p", "tr");
    r.appendChild(el("b", null, "Skip: "));
    r.appendChild(document.createTextNode(t.reason || ""));
    n.appendChild(r);
    tw.appendChild(n);
    trapRows.push({ store: t.store, node: n });
  });

  /* ---- store filter ---- */
  var counts = {};
  deals.forEach(function (d) { counts[d.store] = (counts[d.store] || 0) + 1; });
  var stores = Object.keys(counts).sort(function (a, b) {
    if (a === v.store) return -1;
    if (b === v.store) return 1;
    return counts[b] - counts[a] || a.localeCompare(b);
  });
  var active = null, chipWrap = $("chips"), chipList = [];

  function chip(text, count, store) {
    var b = el("button", "chip");
    b.type = "button";
    b.appendChild(document.createTextNode(text));
    if (count) b.appendChild(el("u", null, count));
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () { apply(active === store ? null : store); });
    chipWrap.appendChild(b);
    chipList.push({ btn: b, store: store });
  }
  chip("All stores", String(deals.length), null);
  stores.forEach(function (s) { chip(s, String(counts[s]), s); });

  function apply(store) {
    active = store;
    chipList.forEach(function (c) { c.btn.setAttribute("aria-pressed", c.store === store ? "true" : "false"); });

    var nMine = 0, nRest = 0, nTraps = 0;
    rows.forEach(function (r) {
      var show = !store || r.store === store;
      r.node.hidden = !show;
      if (show) { if (r.list === "mine") nMine++; else nRest++; }
    });
    $("mylistSection").hidden = nMine === 0;
    $("mylistCount").textContent = nMine + (nMine === 1 ? " match" : " matches");
    $("dealsCount").textContent = nRest + " worth buying";
    emptyMsg.hidden = nRest > 0;
    emptyMsg.textContent = store ? "Nothing else worth buying at " + store + " this week."
                                 : "No staple deals cleared the bar this week.";
    trapRows.forEach(function (r) {
      var show = !store || r.store === store;
      r.node.hidden = !show;
      if (show) nTraps++;
    });
    $("trapsSection").hidden = nTraps === 0;
    updatePicked();
  }

  function updatePicked() {
    var vis = 0, done = 0;
    rows.forEach(function (r) {
      if (r.node.hidden) return;
      vis++;
      if (r.node.getAttribute("aria-checked") === "true") done++;
    });
    var p = $("picked");
    p.hidden = done === 0;
    p.textContent = done + " of " + vis + " got";
  }

  apply(null);

  /* ---- footer ---- */
  var fm = $("footMeta");
  [["Week", weekLabel(D.week)],
   ["Flyers", D.flyerCount],
   ["Prices checked", D.pricesChecked != null ? D.pricesChecked.toLocaleString() : null],
   ["History", D.weeksOfHistory != null ? D.weeksOfHistory + (D.weeksOfHistory === 1 ? " week" : " weeks") : null]
  ].forEach(function (p) {
    if (p[1] == null || p[1] === "") return;
    var s = el("span");
    s.appendChild(document.createTextNode(p[0] + " "));
    s.appendChild(el("b", null, String(p[1])));
    fm.appendChild(s);
  });
  if (D.repo) {
    var a = el("a", null, "Pipeline source on GitHub");
    a.href = D.repo; a.rel = "noopener";
    $("footRepo").appendChild(a);
  }

})();
</script>
</body>
</html>
